[workspace]
members = ["crates/canexus-core", "crates/canexus-cli", "crates/canexus-gui"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/JannisRln/CANexus-Studio"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
