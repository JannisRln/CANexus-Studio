[package]
name = "canexus-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
slint = "=1.17.1"
pbslintdock = { git = "https://github.com/pbtechlab/pbSlintDock", rev = "059418b3704bbe0b4699e89341a4567a37904fc9" }

[build-dependencies]
slint-build = "=1.17.1"

# Slint's generated Rust includes unsafe-backed vtables; this exception is
# limited to the GUI crate. The core and CLI retain workspace unsafe_code=forbid.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
