name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-state:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project state
        run: python scripts/check_project_state.py
  rust:
    env:
      PBSLINTDOCK_ROOT: ${{ github.workspace }}/third_party/pbSlintDock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned pbSlintDock (DEV-003)
        uses: actions/checkout@v4
        with:
          repository: pbtechlab/pbSlintDock
          ref: 059418b3704bbe0b4699e89341a4567a37904fc9
          path: third_party/pbSlintDock
          persist-credentials: false
      - name: Install native Linux GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Detect Rust workspace
        id: workspace
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Rust checks skipped: Cargo.toml not yet present'
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.workspace.outputs.present == 'true'
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - name: Formatting
        if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        if: steps.workspace.outputs.present == 'true'
        run: cargo build --workspace --all-targets
      - name: Test
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --all-targets
